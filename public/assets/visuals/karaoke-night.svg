<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15151a"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
    <linearGradient id="beamL" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#e53935" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e53935" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamR" x1="1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1e4dff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1e4dff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- stage light beams -->
  <path d="M180 30 L60 420 L340 420 z" fill="url(#beamL)"/>
  <path d="M620 30 L460 420 L740 420 z" fill="url(#beamR)"/>
  <circle cx="180" cy="32" r="16" fill="#e53935" opacity="0.9" filter="url(#glow)"/>
  <circle cx="620" cy="32" r="16" fill="#1e4dff" opacity="0.9" filter="url(#glow)"/>
  <rect x="120" y="14" width="560" height="10" rx="5" fill="#26262d"/>

  <!-- neon zigzag accent -->
  <path d="M90 200 l40 -26 l-18 30 l44 -28" fill="none" stroke="#ffb020" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M90 200 l40 -26 l-18 30 l44 -28" fill="none" stroke="#ffd47e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- music notes -->
  <g fill="#8fa9ff" opacity="0.85">
    <g transform="translate(640 180)">
      <ellipse cx="0" cy="22" rx="10" ry="7"/>
      <rect x="7" y="-22" width="5" height="44" rx="2.5"/>
      <path d="M12 -22 q22 4 22 20 q-8 -10 -22 -8 z"/>
    </g>
    <g transform="translate(120 300) scale(0.7)" fill="#ff8a87">
      <ellipse cx="0" cy="22" rx="10" ry="7"/>
      <rect x="7" y="-22" width="5" height="44" rx="2.5"/>
    </g>
    <g transform="translate(700 320) scale(0.6)" fill="#ffd47e">
      <ellipse cx="0" cy="22" rx="10" ry="7"/>
      <rect x="7" y="-22" width="5" height="44" rx="2.5"/>
    </g>
  </g>

  <!-- microphone on stand -->
  <g>
    <circle cx="400" cy="150" r="44" fill="#3a3a44"/>
    <circle cx="400" cy="150" r="44" fill="none" stroke="#5c5c6a" stroke-width="4"/>
    <g stroke="#26262d" stroke-width="3">
      <line x1="364" y1="136" x2="436" y2="136"/>
      <line x1="358" y1="150" x2="442" y2="150"/>
      <line x1="364" y1="164" x2="436" y2="164"/>
      <line x1="386" y1="110" x2="386" y2="190"/>
      <line x1="414" y1="110" x2="414" y2="190"/>
    </g>
    <circle cx="384" cy="132" r="10" fill="#f2f2f2" opacity="0.25"/>
    <path d="M396 194 h8 v110 h-8 z" fill="#3a3a44"/>
    <path d="M352 392 q48 -22 96 0 l-10 10 h-76 z" fill="#2e2e36"/>
    <!-- mic glow -->
    <circle cx="400" cy="150" r="58" fill="#e53935" opacity="0.14" filter="url(#glow)"/>
  </g>

  <!-- stage floor -->
  <rect x="0" y="402" width="800" height="78" fill="#16161b"/>
  <rect x="0" y="402" width="800" height="5" fill="#e53935" opacity="0.4"/>
  <rect x="0" y="407" width="800" height="3" fill="#1e4dff" opacity="0.4"/>
</svg>
