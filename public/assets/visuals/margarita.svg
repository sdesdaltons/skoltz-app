<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <circle cx="48" cy="48" r="34" fill="#2ecc71" opacity="0.14" filter="url(#g)"/>
  <!-- glass bowl -->
  <path d="M20 26 h56 l-22 24 v18 h-12 v-18 z" fill="none" stroke="#9fd9b8" stroke-width="4" stroke-linejoin="round"/>
  <!-- drink fill -->
  <path d="M26 31 h44 l-17 18 h-10 z" fill="#7fd6a4" opacity="0.85"/>
  <!-- salt rim -->
  <line x1="18" y1="24" x2="78" y2="24" stroke="#f2f2f2" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 5"/>
  <!-- lime wheel -->
  <g transform="translate(72 28)">
    <circle r="11" fill="#5fae4e"/>
    <circle r="8" fill="#a8e08a"/>
    <g stroke="#5fae4e" stroke-width="2">
      <line x1="0" y1="-8" x2="0" y2="8"/>
      <line x1="-8" y1="0" x2="8" y2="0"/>
      <line x1="-5.5" y1="-5.5" x2="5.5" y2="5.5"/>
      <line x1="-5.5" y1="5.5" x2="5.5" y2="-5.5"/>
    </g>
  </g>
  <!-- stem base -->
  <rect x="36" y="70" width="24" height="5" rx="2.5" fill="#9fd9b8"/>
  <!-- sparkle -->
  <g stroke="#ffb020" stroke-width="3" stroke-linecap="round">
    <line x1="28" y1="12" x2="28" y2="18"/>
    <line x1="25" y1="15" x2="31" y2="15"/>
  </g>
</svg>
